[project]
name = "parkinsons-desease-progression-prediction"
version = "0.1.0"
description = "project implements machine learning models for predicting Parkinson's disease progression using the AMP-PD dataset"
authors = [
    {name = "angelova",email = "angelova.03@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pre-commit (>=4.2.0,<5.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "dvc (>=3.60.0,<4.0.0)",
    "numpy (>=1.26,<2.0)",
    "pandas (>=2.2,<3.0)",
    "onnxruntime (>=1.22.0,<2.0.0)",
    "mlflow (>=2.22.1,<3.0.0)",
    "onnxmltools (>=1.13.0,<2.0.0)",
    "onnx (==1.13.1)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "pytorch-lightning (>=2.5.1.post0,<3.0.0)",
    "torch (>=2.5.1,<3.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "dvc-gdrive (>=3.0.1,<4.0.0)",
    "cryptography (==39.0)",
    "pyopenssl (==23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-gpu"}
